<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindSpark - Morandi Diffuse</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
              serif: ['Playfair Display', 'Merriweather', 'serif'], // Added serif for titles if needed
              mono: ['JetBrains Mono', 'Menlo', 'monospace'],
            },
            colors: {
              morandi: {
                sage: '#949F97',    // 鼠尾草灰绿 - Deep, Stable
                cream: '#EBE2AA',   // 奶油黄 - Warm, Bright
                mint: '#C8D5C5',    // 薄荷灰 - Fresh, Light
                beige: '#EEE9D0',   // 米杏色 - Base, Soft
                text: {
                  primary: '#4B5563', // Gray 700
                  secondary: '#6B7280', // Gray 500
                }
              }
            },
            animation: {
              'float-slow': 'float 20s ease-in-out infinite',
              'float-medium': 'float 15s ease-in-out infinite reverse',
              'float-fast': 'float 10s ease-in-out infinite',
              'pulse-slow': 'pulse 8s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translate(0, 0) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.95)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap');
      
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background-color: rgba(148, 159, 151, 0.4);
        border-radius: 20px;
      }
      
      body {
        margin: 0;
        overflow: hidden;
        font-family: 'Inter', sans-serif;
        background-color: #EEE9D0;
        color: #4B5563;
      }
      
      ::selection {
        background: #EBE2AA; /* Cream selection */
        color: #374151;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-markdown": "https://esm.sh/react-markdown@^10.1.0",
    "uuid": "https://esm.sh/uuid@^13.0.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.561.0",
    "react-draggable": "https://esm.sh/react-draggable@^4.4.6"
  }
}
</script>
</head>
  <body class="antialiased h-screen w-screen overflow-hidden">
    <div id="root" class="h-full w-full"></div>
  </body>
</html>
